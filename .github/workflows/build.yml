name: Build Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: ${{ steps.build.outputs.build-output }} 
